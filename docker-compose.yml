version: '3.9'

services:
  # Option 1: All-in-One Deployment (Recommended for Azure)
  # Bundles Next.js, FastAPI, and Cloudflare Tunnel in a single container.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoom-workplace
    ports:
      - "8000:8000"
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - FRONTEND_URL=${FRONTEND_URL:-https://kunalmujoo.dpdns.org}
    volumes:
      - sqlite-data:/app/backend
    restart: unless-stopped

volumes:
  sqlite-data:
